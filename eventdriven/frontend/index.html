<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantaSneaks — Limited Drop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050510;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(100,200,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100,200,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        nav {
            position: fixed;
            top: 0; width: 100%;
            padding: 18px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(100,200,255,0.08);
            z-index: 100;
        }
        nav img { height: 64px; cursor: pointer; }
        nav ul {
            list-style: none; display: flex; gap: 32px;
            font-size: 13px; color: rgba(255,255,255,0.45); letter-spacing: 0.5px;
        }

        /* ---------- HOME ---------- */
        .hero {
            position: relative; min-height: 100vh;
            display: flex; align-items: center;
            padding: 100px 48px 48px; gap: 40px; z-index: 1;
        }
        .hero-content { flex: 1; max-width: 580px; }

        .badge {
            display: inline-block;
            background: rgba(79,172,254,0.12);
            border: 1px solid rgba(79,172,254,0.3);
            color: #64c8ff;
            padding: 7px 18px; border-radius: 20px;
            font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
            margin-bottom: 28px;
        }
        h1 {
            font-size: clamp(52px, 7vw, 88px);
            font-weight: 900; line-height: 0.95; letter-spacing: -2px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #ffffff 0%, #64c8ff 55%, #b87fff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .tagline {
            font-size: 17px; color: rgba(255,255,255,0.45);
            line-height: 1.7; margin-bottom: 40px; max-width: 440px;
        }
        .stats {
            display: flex; gap: 40px; margin-bottom: 48px;
            padding-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .stat-val { font-size: 30px; font-weight: 800; color: #64c8ff; }
        .stat-lbl {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            color: rgba(255,255,255,0.35); margin-top: 2px;
        }
        .buy-form { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
        select {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(100,200,255,0.2);
            color: #fff; padding: 15px 20px; border-radius: 12px;
            font-size: 15px; cursor: pointer; outline: none; transition: border-color 0.2s;
        }
        select:focus { border-color: rgba(100,200,255,0.5); }
        select option { background: #0d0d20; }
        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #a855f7 100%);
            color: #fff; border: none; padding: 15px 44px;
            font-size: 16px; font-weight: 700; border-radius: 12px; cursor: pointer;
            letter-spacing: 0.5px; box-shadow: 0 0 32px rgba(79,172,254,0.25);
            transition: transform 0.18s, box-shadow 0.18s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 0 52px rgba(79,172,254,0.45); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .fine-print { margin-top: 14px; font-size: 12px; color: rgba(255,255,255,0.25); }

        .hero-visual {
            flex: 1; position: relative; display: flex;
            justify-content: center; align-items: center; min-height: 500px;
        }
        .glow {
            position: absolute; width: 480px; height: 480px;
            background: radial-gradient(circle, rgba(79,172,254,0.12) 0%, transparent 70%); border-radius: 50%;
        }
        .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(79,172,254,0.12); }
        .ring-1 { width: 500px; height: 500px; animation: spin 18s linear infinite; }
        .ring-2 { width: 620px; height: 620px; border-color: rgba(168,85,247,0.08); animation: spin 26s linear infinite reverse; }
        .ring-3 { width: 740px; height: 740px; border-color: rgba(79,172,254,0.05); animation: spin 36s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .sneaker {
            position: relative; width: 480px; max-width: 85%;
            filter: drop-shadow(0 0 48px rgba(79,172,254,0.35));
            animation: float 4.5s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-22px) rotate(-4deg); }
        }

        /* ---------- FLOW CARD (checkout + status) ---------- */
        .flow-wrap {
            min-height: 100vh; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 100px 24px 48px; position: relative; z-index: 1;
        }
        .card {
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(100,200,255,0.12);
            border-radius: 24px; padding: 52px 48px;
            width: 480px; max-width: 92vw; text-align: center;
        }
        .card .sneaker-preview {
            width: 200px; margin: 0 auto 24px;
            filter: drop-shadow(0 0 24px rgba(79,172,254,0.3));
        }
        .order-id {
            font-size: 11px; color: rgba(255,255,255,0.25);
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 28px;
            font-variant-numeric: tabular-nums;
        }
        .icon { font-size: 52px; margin-bottom: 18px; }
        .title { font-size: 23px; font-weight: 800; margin-bottom: 10px; }
        .sub { font-size: 14px; color: rgba(255,255,255,0.45); line-height: 1.65; }
        .spinner {
            width: 52px; height: 52px;
            border: 3px solid rgba(100,200,255,0.15); border-top-color: #64c8ff;
            border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto 24px;
        }
        .price {
            font-size: 48px; font-weight: 900; margin: 8px 0 4px;
            background: linear-gradient(135deg, #64c8ff, #b87fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        /* progress steps */
        .steps {
            display: flex; justify-content: center; gap: 8px;
            margin: 26px 0 4px;
        }
        .step {
            width: 44px; height: 4px; border-radius: 2px;
            background: rgba(255,255,255,0.1); transition: background 0.4s;
        }
        .step.done { background: linear-gradient(90deg, #4facfe, #a855f7); }
        .step.active { background: #64c8ff; animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
        .track {
            margin-top: 20px; font-size: 12px; letter-spacing: 1px;
            color: #64c8ff; font-variant-numeric: tabular-nums;
        }
        .link-btn {
            margin-top: 26px; display: inline-block; background: none;
            border: 1px solid rgba(100,200,255,0.25); color: #64c8ff;
            padding: 12px 28px; border-radius: 12px; font-size: 14px; cursor: pointer;
            transition: border-color 0.2s;
        }
        .link-btn:hover { border-color: rgba(100,200,255,0.6); }

        @media (max-width: 820px) {
            .hero { flex-direction: column; text-align: center; padding-top: 120px; }
            .hero-visual { min-height: 340px; }
            .stats, .buy-form { justify-content: center; }
            nav ul { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <img src="/assets/logo.png" alt="QuantaSneaks" onclick="location.href='/'">
        <ul><li>Drop Details</li><li>Sizing Guide</li><li>About</li></ul>
    </nav>

    <!-- ============ HOME ============ -->
    <section class="hero" id="home">
        <div class="hero-content">
            <div class="badge">⚡ Limited Drop — 500 Pairs Only</div>
            <h1>QUANTA<br>SNEAKS</h1>
            <p class="tagline">Quantum-engineered soles. AI-verified drops.<br>The future of footwear lands now.</p>

            <div class="stats">
                <div><div class="stat-val">500</div><div class="stat-lbl">Pairs Available</div></div>
                <div><div class="stat-val">$299</div><div class="stat-lbl">Retail Price</div></div>
                <div><div class="stat-val">AI</div><div class="stat-lbl">Verified Drop</div></div>
            </div>

            <form class="buy-form" id="buyForm">
                <select name="size" id="size" required>
                    <option value="" disabled selected>Select Size (US)</option>
                    <option value="7">US 7</option>
                    <option value="8">US 8</option>
                    <option value="9">US 9</option>
                    <option value="10">US 10</option>
                    <option value="11">US 11</option>
                    <option value="12">US 12</option>
                </select>
                <button type="submit" class="btn" id="buyBtn">CLAIM YOUR PAIR →</button>
            </form>
            <p class="fine-print">⚡ AI-powered verification · One pair per customer · Final sale</p>
        </div>

        <div class="hero-visual">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="glow"></div>
            <img class="sneaker" src="/assets/sneaker.png" alt="QuantaSneaks">
        </div>
    </section>

    <!-- ============ FLOW (checkout + status) ============ -->
    <section class="flow-wrap" id="flow">
        <div class="card">
            <img class="sneaker-preview" src="/assets/sneaker.png" alt="QuantaSneaks">
            <div class="order-id" id="orderIdLabel">Order · —</div>
            <div id="cardBody"></div>
        </div>
    </section>

    <script>
        const $ = (id) => document.getElementById(id);
        const params = new URLSearchParams(location.search);

        // Every status the order row can hold in DynamoDB → how to show it.
        const STATES = {
            CREATED:            { icon: '🧾', title: 'Order placed',        sub: 'Your claim is registered. Reserving a pair for you…', step: 0 },
            INVENTORY_RESERVED: { icon: '📦', title: 'Stock reserved',      sub: 'A pair is being held for you. Preparing secure checkout…', step: 0 },
            AWAITING_PAYMENT:   { icon: '💳', title: 'Ready for payment',   sub: 'Opening secure Stripe checkout…', step: 1 },
            PAID:               { icon: '✅', title: 'Payment confirmed',   sub: 'Booking your shipment…', step: 2 },
            SHIPPED:            { icon: '🚀', title: "You're getting your QuantaSneaks!", sub: 'Order confirmed and on its way to you.', step: 3 },
        };

        function showFlow(orderId) {
            $('home').style.display = 'none';
            $('flow').style.display = 'flex';
            $('orderIdLabel').textContent = 'Order · ' + orderId;
        }

        function stepsHtml(current) {
            let out = '<div class="steps">';
            for (let i = 0; i < 4; i++) {
                const cls = i < current ? 'done' : (i === current ? 'active' : '');
                out += `<div class="step ${cls}"></div>`;
            }
            return out + '</div>';
        }

        function renderState(order, { spinner = true } = {}) {
            const meta = STATES[order.status] || { icon: '⏳', title: order.status || 'Working…', sub: 'Processing your order…', step: 0 };
            const isTerminal = order.status === 'SHIPPED';
            let html = '';
            html += isTerminal ? `<div class="icon">${meta.icon}</div>`
                               : (spinner ? '<div class="spinner"></div>' : `<div class="icon">${meta.icon}</div>`);
            html += `<div class="title">${meta.title}</div>`;
            html += `<div class="sub">${meta.sub}</div>`;
            html += stepsHtml(meta.step);
            if (order.trackingNumber) html += `<div class="track">TRACKING · ${order.trackingNumber}</div>`;
            if (isTerminal) html += `<button class="link-btn" onclick="location.href='/'">Back to drop</button>`;
            $('cardBody').innerHTML = html;
        }

        function renderError(msg) {
            $('cardBody').innerHTML =
                `<div class="icon">⚠️</div><div class="title">Something went wrong</div>
                 <div class="sub">${msg}</div>
                 <button class="link-btn" onclick="location.href='/'">Start over</button>`;
        }

        // 1) Place the order → poll until the Stripe checkout URL is ready → redirect.
        async function placeOrder(size) {
            $('buyBtn').disabled = true;
            $('buyBtn').textContent = 'Claiming…';
            let orderId;
            try {
                const res = await fetch('/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        currency: 'usd',
                        customerEmail: 'demo@quantasneaks.io',
                        items: [{ name: `QuantaSneaks — US ${size}`, price: 29900, qty: 1 }]
                    })
                });
                if (!res.ok) throw new Error('Could not create order (' + res.status + ')');
                orderId = (await res.json()).orderId;
            } catch (e) {
                showFlow('—'); renderError(e.message); return;
            }
            showFlow(orderId);
            pollForCheckout(orderId);
        }

        // Poll GET /orders/{id} until payment Lambda writes checkoutUrl, then redirect to Stripe.
        async function pollForCheckout(orderId) {
            try {
                const order = await (await fetch('/orders/' + orderId)).json();
                renderState(order);
                if (order.checkoutUrl) {
                    // brief beat so the user sees "Ready for payment" before the redirect
                    setTimeout(() => { window.location.href = order.checkoutUrl; }, 700);
                    return;
                }
                setTimeout(() => pollForCheckout(orderId), 2000);
            } catch (e) {
                renderError('Lost connection while preparing checkout.');
            }
        }

        // 2) After Stripe redirects back → poll until the order ships.
        async function pollForShipment(orderId) {
            try {
                const order = await (await fetch('/orders/' + orderId)).json();
                // Once paid, status stays AWAITING_PAYMENT until the webhook→shipment chain runs;
                // show a "confirming payment" beat instead of the checkout copy.
                if (order.status === 'AWAITING_PAYMENT') {
                    order.status = 'PAID';
                }
                renderState(order);
                if (order.status !== 'SHIPPED') setTimeout(() => pollForShipment(orderId), 3000);
            } catch (e) {
                renderError('Lost connection while tracking your order.');
            }
        }

        function renderCanceled(orderId) {
            $('cardBody').innerHTML =
                `<div class="icon">🛑</div><div class="title">Checkout canceled</div>
                 <div class="sub">No payment was taken. Your pair is still up for grabs.</div>
                 <button class="link-btn" onclick="location.href='/'">Try again</button>`;
        }

        // ---- router ----
        $('buyForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const size = $('size').value;
            if (size) placeOrder(size);
        });

        const orderId = params.get('orderId');
        if (orderId && params.get('paid') === '1') {
            showFlow(orderId);
            pollForShipment(orderId);
        } else if (orderId && params.get('canceled') === '1') {
            showFlow(orderId);
            renderCanceled(orderId);
        }
        // else: default home view
    </script>
</body>
</html>
